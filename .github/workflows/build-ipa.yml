name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      signing:
        description: '签名方式'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned      # 不签名，产出未签名 IPA（自己再签）
          - adhoc         # 用 Secrets 里的证书做 ad-hoc / development 签名

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build QFSpeed
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # ---------- 签名准备（仅 adhoc 模式）----------
      - name: Import signing certificate
        if: ${{ github.event.inputs.signing == 'adhoc' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      # ---------- 编译 ----------
      # 关键：只编译、不签名，后续手工打 IPA。
      # 这样不依赖任何证书，谁 fork 都能跑出产物。
      - name: Build (unsigned)
        shell: bash
        run: |
          set -o pipefail
          # 不走 xcpretty：它缺失时会连编译失败一起吞掉，排查成本高
          xcodebuild \
            -project QFSpeed.xcodeproj \
            -scheme QFSpeed \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee build.log
          # pipefail 已保证 xcodebuild 的退出码会传出来，无需额外判断

      - name: Collect errors on failure
        if: failure()
        run: |
          echo "===== Errors ====="
          grep -n "error:" build.log | head -60 || echo "(no error: lines found)"
          echo "===== Warnings ====="
          grep -n "warning:" build.log | head -40 || true

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          echo "App bundle: $APP_PATH"
          test -n "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PATH/Info.plist")
          IPA_NAME="QFSpeed-${VERSION}-${BUILD}-unsigned.ipa"
          zip -qry "$IPA_NAME" Payload
          echo "IPA_NAME=$IPA_NAME" >> $GITHUB_ENV
          ls -lh "$IPA_NAME"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QFSpeed-ipa
          path: ${{ env.IPA_NAME }}
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
