name: QFSpeed
options:
  bundleIdPrefix: com.yourteam
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # 填你自己的 Team ID
    CODE_SIGN_STYLE: Automatic

targets:
  QFSpeed:
    type: application
    platform: iOS
    sources:
      - path: Sources/QFSpeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourteam.qfspeed
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Resources/Info.plist
